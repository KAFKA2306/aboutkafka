name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record runtime
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Guard legacy boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Legacy prototype' src/App.tsx
          grep -Fq 'https://github.com/KAFKA2306/KAFKA2306' src/App.tsx
          ! grep -Eq '[0-9]+ (Stars|Followers|Following)' src/App.tsx
          ! grep -Fq 'discordapp.com/users/' src/App.tsx
